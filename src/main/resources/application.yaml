server:
  port: 8080

spring:
  application:
    name: crudpruebas
  # Con spring-boot-starter-webflux en el classpath (solo para tener
  # WebClient), Spring podria dudar entre levantar un server servlet (Tomcat)
  # o uno reactivo (Netty). Lo forzamos explicito: seguimos siendo MVC/Tomcat.
  main:
    web-application-type: servlet
  threads:
    virtual:
      enabled: true
  # DATOS DE CONEXION DUMMY -- validos solo como placeholder/documentacion.
  # Para desarrollo local, las credenciales reales van en
  # application-local.yaml (gitignored, ver application-local.yaml.example)
  # activando el perfil: SPRING_PROFILES_ACTIVE=local
  # Para otros ambientes (CI, produccion), se usa la variable de entorno
  # ORACLE_DB_PASSWORD -- la clave NUNCA va hardcodeada de verdad en ningun
  # archivo que se suba a git.
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    driver-class-name: oracle.jdbc.OracleDriver
    username: crudpruebas_app
    password: ${ORACLE_DB_PASSWORD:cambiar-esta-clave}
  jpa:
    hibernate:
      # "validate" (no "update"): Hibernate compara tus @Entity contra las
      # tablas reales y falla al arrancar si no coinciden -- pero NUNCA
      # modifica el esquema. Ahora el esquema lo maneja Flyway, con SQL
      # explicito y versionado (src/main/resources/db/migration/).
      ddl-auto: validate
    show-sql: true

# Configuracion PROPIA de la app (no la lee ningun starter de Spring,
# la definimos nosotros y la leemos con ClimaApiProperties).
# El api-key NUNCA va hardcodeado -- ${VAR:default} lee la variable de
# entorno CLIMA_API_KEY, y si no existe usa "sin-configurar".
app:
  clima-api:
    base-url: https://api.clima-externo.com
    api-key: ${CLIMA_API_KEY:sin-configurar}
  jwt:
    # El secreto NUNCA hardcodeado de verdad -- mismo patron que el resto:
    # variable de entorno en cualquier ambiente real. Tiene que ser largo
    # (HS256 pide minimo 256 bits / 32 caracteres) -- este placeholder ya
    # cumple esa longitud, pero de verdad HAY que reemplazarlo.
    secret: ${JWT_SECRET:este-es-un-secreto-de-ejemplo-cambialo-en-produccion-1234}
    expiracion-ms: 3600000  # 1 hora

# Actuator: por default Spring SOLO expone "health" e "info" por HTTP --
# el resto de los endpoints (env, beans, metrics, threaddump...) existen
# pero quedan apagados hasta que los listes aca a proposito. "metrics" lo
# agregamos porque es el mas util para empezar (cuantos requests, memoria,
# etc.) -- NUNCA agregues "*" (expone TODO, incluido "env": variables de
# entorno, con secretos incluidos) salvo que sepas exactamente que estas
# haciendo y quede bien protegido detras de autenticacion.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # "when-authorized": el detalle (que componente puntual esta down --
      # DB, disco, etc.) solo se ve autenticado. Un caller anonimo solo ve
      # {"status":"UP"} o {"status":"DOWN"}, sin detalle -- evita filtrar
      # de mas ("la base de datos X no responde en el host Y") a cualquiera
      # que le pegue al endpoint publico.
      show-details: when-authorized

# Sin esto, Spring Boot loguea todo en INFO por default -- ni mucho ni
# poco, un termino medio generico. "root" es el nivel de TODO lo que no
# tenga una regla mas especifica (librerias de terceros incluidas).
# "com.practica.crudpruebas" en DEBUG es MAS especifico que "root", asi
# que gana para nuestro propio codigo -- vemos mas detalle solo de lo
# que escribimos nosotros, sin inundarnos con el ruido de Hibernate/
# Spring internals (que se quedan en INFO, via el nivel root).
logging:
  level:
    root: INFO
    com.practica.crudpruebas: DEBUG
  pattern:
    # %logger{36}: nombre de la clase que logueo, truncado a 36 caracteres
    # -- asi cada linea dice DE DONDE salio, sin tener que adivinar.
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
