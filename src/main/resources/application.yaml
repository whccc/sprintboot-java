server:
  port: 8080

spring:
  application:
    name: crudpruebas
  threads:
    virtual:
      enabled: true
  # DATOS DE CONEXION DUMMY -- validos solo como placeholder/documentacion.
  # Para desarrollo local, las credenciales reales van en
  # application-local.yaml (gitignored, ver application-local.yaml.example)
  # activando el perfil: SPRING_PROFILES_ACTIVE=local
  # Para otros ambientes (CI, produccion), se usa la variable de entorno
  # ORACLE_DB_PASSWORD -- la clave NUNCA va hardcodeada de verdad en ningun
  # archivo que se suba a git.
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    driver-class-name: oracle.jdbc.OracleDriver
    username: crudpruebas_app
    password: ${ORACLE_DB_PASSWORD:cambiar-esta-clave}
  jpa:
    hibernate:
      # "validate" (no "update"): Hibernate compara tus @Entity contra las
      # tablas reales y falla al arrancar si no coinciden -- pero NUNCA
      # modifica el esquema. Ahora el esquema lo maneja Flyway, con SQL
      # explicito y versionado (src/main/resources/db/migration/).
      ddl-auto: validate
    show-sql: true

# Configuracion PROPIA de la app (no la lee ningun starter de Spring,
# la definimos nosotros y la leemos con ClimaApiProperties).
# El api-key NUNCA va hardcodeado -- ${VAR:default} lee la variable de
# entorno CLIMA_API_KEY, y si no existe usa "sin-configurar".
app:
  clima-api:
    base-url: https://api.clima-externo.com
    api-key: ${CLIMA_API_KEY:sin-configurar}
